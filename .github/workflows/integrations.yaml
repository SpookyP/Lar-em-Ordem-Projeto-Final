name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  laravel-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: lar_em_ordem_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    defaults:
      run:
        working-directory: ./lar-em-ordem-api

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar ambiente PHP (v8.5)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo, pdo_mysql
          coverage: none

      - name: Copiar .env de Teste
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Instalar Dependências do Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Gerar Chave da Aplicação
        run: php artisan key:generate

      - name: Executar Migrações e Testes (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: lar_em_ordem_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: |
          php artisan migrate --force
          ./vendor/bin/phpunit

  react-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lar-em-ordem-frontend

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./lar-em-ordem-frontend/package-lock.json

      - name: Instalar Dependências do NPM
        run: npm ci || npm install

      - name: Validar Build de Produção
        run: npm run build