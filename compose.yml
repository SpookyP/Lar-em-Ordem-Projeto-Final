services:
  mysql:
    image: mysql:8.4.3
    container_name: mysql_dev
    restart: always
    environment:
      MYSQL_DATABASE: laremordemdb
      MYSQL_USER: laremordemuser
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dev-network

  api:
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: api_dev
    restart: always
    volumes:
      - ./lar-em-ordem-api:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laremordemdb
      - DB_USERNAME=laremordemuser
      - DB_PASSWORD=secret_password
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dev-network

  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./lar-em-ordem-api:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - dev-network

  frontend:
    build:
      context: ./lar-em-ordem-frontend
      dockerfile: Dockerfile
    container_name: frontend_dev
    restart: always
    ports:
      - "5173:5173"
    networks:
      - dev-network
  setup:
    profiles:
      - setup
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: lar_setup
    volumes:
      - ./lar-em-ordem-api:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laremordemdb
      - DB_USERNAME=laremordemuser
      - DB_PASSWORD=secret_password
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        [ -f .env ] || cp .env.example .env
        composer install --no-interaction
        grep -q '^APP_KEY=.' .env || php artisan key:generate --force
        if php artisan migrate:status >/dev/null 2>&1; then
          php artisan migrate --force
        else
          php artisan migrate --force --seed
        fi
    networks:
      - dev-network

volumes:
  mysql_data:

networks:
  dev-network:
    driver: bridge
