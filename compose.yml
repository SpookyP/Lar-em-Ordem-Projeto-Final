services:
  mysql:
    image: mysql:8.4.3
    container_name: mysql_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laremordemdb
      MYSQL_USER: laremordemuser
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - dev-network

  api:
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: api_dev
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
    volumes:
      - ./lar-em-ordem-api:/var/www/html
      - /var/www/html/vendor
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/php/security.ini:/usr/local/etc/php/conf.d/security.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      - mysql
    networks:
      - dev-network

  nginx:
    image: nginx:alpine
    container_name: nginx_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
    volumes:
      - ./lar-em-ordem-api/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dev-network

  reverb:
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: reverb_dev
    restart: unless-stopped
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./lar-em-ordem-api:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - dev-network

  queue:
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: queue_dev
    restart: unless-stopped
    command: ["php", "artisan", "queue:listen", "--tries=3"]
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./lar-em-ordem-api:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - api
    networks:
      - dev-network

  scheduler:
    build:
      context: ./lar-em-ordem-api
      dockerfile: Dockerfile
    container_name: scheduler_dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./lar-em-ordem-api:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - api
    networks:
      - dev-network

  frontend:
    build:
      context: ./lar-em-ordem-frontend
      dockerfile: Dockerfile
      target: development
    container_name: frontend_dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./lar-em-ordem-frontend:/app:z
      - /app/node_modules
    networks:
      - dev-network

volumes:
  mysql_data:

networks:
  dev-network:
    driver: bridge
